# Settings used by the tests.
# On the test classpath this file is used instead of src/main/resources/application.properties,
# so the tests never depend on the values you run the real server with.

spring.application.name=messaging-service-test

# The tests pick a free port themselves, so this value is not used for listening
messaging.tcp.port=0

# Both limits are 4: the tests register 4 clients and expect the 5th to be refused
messaging.tcp.max-connections=4
messaging.tcp.max-clients=4

messaging.tcp.mailbox-capacity=10
messaging.tcp.max-message-size=4096
messaging.tcp.outbound-queue-capacity=10

# Long enough that no test is closed for being idle
messaging.tcp.idle-timeout-millis=60000
