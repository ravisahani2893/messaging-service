spring.application.name=messaging-service

# TCP server configuration
messaging.tcp.port=9090
messaging.tcp.max-connections=100
messaging.tcp.mailbox-capacity=100
messaging.tcp.max-message-size=4096
messaging.tcp.outbound-queue-capacity=100
# Max distinct client IDs ever registered (clients are never removed)
messaging.tcp.max-clients=1000
# Close a connection that sends nothing for this long (5 minutes)
messaging.tcp.idle-timeout-millis=300000